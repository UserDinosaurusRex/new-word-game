<!DOCTYPE html>
<html>

<head>
  <!-- Sets the character encoding to UTF-8 for proper text display -->
  <meta charset="UTF-8">

  <!-- Sets the title of the webpage (appears in browser tab or Home Screen) -->
  <title>Next Word Game</title>

  <!-- Ensures the page scales properly on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Enables full-screen mode when added to iPhone Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Sets the status bar style for fullscreen web apps on iPhone -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- CSS styling for the page -->
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Styles the entire page body */
    body {
      font-family: sans-serif;     /* Sets the font for all text */
      background-color: #c8e6ff;   /* Light blue background */
      text-align: center;           /* Center all text horizontally */
      margin: 0;                    /* Remove default margins */
      padding-top: 100px;           /* Adds space at the top */
    }

    /* Styles the main word heading */
    h1 {
      font-size: 60px;              /* Large font size for the word */
      color: purple;                /* Purple text color */
      margin-bottom: 40px;          /* Space below the heading */
      word-break: break-word;
      padding: 0 20px;
    }

    /* Styles the message paragraph below the word */
    #message {
      font-size: 24px;              /* Medium font size for message */
      color: darkblue;              /* Dark blue text color */
      margin-bottom: 50px;          /* Space below the message */
    }

    /* Styles the Next Word button */
    button {
      background-color: orange;      /* Button background color */
      color: white;                  /* Button text color */
      font-size: 32px;               /* Large text for easy tapping */
      border: none;                  /* Remove default button border */
      padding: 20px 60px;            /* Space inside the button */
      border-radius: 20px;           /* Rounded corners */
    }
  </style>
</head>

<body>

  <!-- Heading that displays the current word -->
  <h1 id="word">Click “Next Word”!</h1>

  <!-- Paragraph for instructions or messages -->
  <p id="message">Tap the button to begin!</p>

  <!-- Button that calls the nextWord() function when clicked -->
  <button onclick="nextWord()">Next Word</button>

  <!-- JavaScript code controlling game logic -->
  <script>

    // ------------------------------------------------------------------
    // WORD LISTS, GROUPED BY HOW OFTEN THEY SHOULD SHOW UP.
    // A word in the weight-3 list shows up about 3x as often as a
    // word in the weight-1 list, a weight-2 word about 2x as often, etc.
    // If a word appears in more than one list below (e.g. it's a normal
    // word AND a "practice more" word), the HIGHEST weight wins.
    // ------------------------------------------------------------------

    // Standard words - normal frequency
    const weight1Words = [
      "his", "her", "an", "would", "know", "some", "could", "does", "train",
      "them", "other", "only", "after", "our", "well", "walrus", "lead",
      "should", "want", "any", "many", "grandma", "grandpa", "ear", "full",
      "oh", "yes", "thank", "here", "light", "money", "nose", "plan",
      "real", "really", "okay", "tell", "thing", "lunch", "much", "song",
      "trouble", "been", "seen", "meet", "away", "last", "tonight", "proud",
      "child", "course", "hold", "game", "forget", "else", "own", "card",
      "four", "five", "second", "yell", "cool", "miss", "pick", "word", "joke",
      "same", "seem", "drink", "part", "sleep", "tomorrow", "myself",
      "number", "somebody", "yourself", "himself", "herself", "thin",
      "dinner", "anyone", "hand", "anyway", "learn", "shut", "town", "thick",
      "beautiful", "both", "yet", "save", "sweet", "until", "while", "final",
      "send", "also", "six", "seven", "eight", "nine", "ten", "eleven", "twelve",
      "thirteen", "fourteen", "fifteen",
      "few", "onto",
      "month", "hurt", "nobody", "perfect", "free", "whatever", "soon",
      "brother", "sister", "end", "we're", "young", "climb",
      "class", "picture", "sell", "side", "wish", "mind", "become", "least",
      "it's", "horse", "join", "build",
      "bite", "under", "paper", "different", "catch", "mine", "speak", "bye",
      "sometimes", "city", "special", "stick", "question", "dance", "fight",
      "awesome", "sick", "dream", "water", "store", "afraid", "cute", "front",
      "ahead", "though", "pretend", "circle", "explore", "neighbor", "grow",
      "grew", "grass", "gave", "robin", "gather", "favorite", "orange", "job",
      "stay", "kick", "came", "clean", "milk", "juice", "honey",
      "smell", "street", "alone", "seat", "hero", "zero", "team", "order",
      "foot", "between", "shoe", "piece", "welcome", "wonderful", "mouth",
      "rest", "behind", "key", "laugh", "machine", "ice", "outside", "rule",
      "follow", "gasp", "waiting", "watches", "swift", "gift", "glide",
      "perform", "drift", "quite", "wrap",

      "little", "need", "talk", "something", "great", "way", "man", "hi",
      "call", "too", "sorry", "love", "wait", "more", "down", "day", "car",
      "very", "off", "try", "maybe", "feel", "friend", "true", "woman", "row",
      "find", "kid", "girl", "boy", "please", "happen", "snail", "one",
      "stop", "night", "bad", "hear", "again", "maze", "may", "today", "walk",
      "have", "this", "your", "think", "say", "because", "said", "fire",
      "give", "back", "over", "people", "first", "fine", "family", "show",
      "room", "truck", "coil", "person", "drum", "are", "loud", "luck", "lucky",
      "beat", "asleep", "sleepy", "that's", "beach", "peach", "sand", "long",
      "plant", "arrive", "tiny", "hurry", "hurried", "flew", "return", "ticket",
      "forever", "balloon", "morning", "whisper", "without", "blow", "anymore",
      "doctor", "dollar", "enough", "sound", "suppose", "worry", "mother", "father",
      "hope", "next", "once", "probably", "eye", "drive", "book", "hang", "since",
      "yesterday", "promise", "math", "add", "animal", "recess", "table", "music", "being", "gold", "old", "trick", "begin",
      "cream", "swing", "chew", "draw", "tired", "park", "funny", "name",
      "string", "snow", "hard", "tries", "cries", "twenty", "twin", "smart",
      "teach", "teacher", "decide", "case", "pants", "either", "underneath", "waft",
      "palace", "accept", "latest", "reason", "realize", "fact", "chance", "charge", "figure",
      "steal", "moment", "date",

      "nice", "still", "black", "turn", "snack", "fake", "air", "hair", "chair",
      "face", "race", "idea", "story", "phone", "sure", "sugar", "start", "believe",
      "party", "never", "around", "week", "world", "push", "basket", "chicken", "guy", "dear",
      "reach"
    ];

    // "Practice more" words - show up about 2x as often as normal words
    const weight2Words = [
      "who", "what", "when", "where", "why", "says", "they", "then", "even", "these", "those",
      "leave", "ever", "mean", "right", "than",
      "pour", "low", "below", "bright", "done", "drop", "fell", "high",
      "threw", "throw", "lie", "tie", "bread", "dark", "white", "cried", "movie",
      "cheese", "choice", "chase", "choose", "chose", "might", "yeah",
      "nothing", "they're", "hole", "read", "there", "such",
      "guess", "before", "always", "listen", "minute", "actually", "place",
      "live", "bring", "every", "everything", "watch", "guest", "hey", "use", "heat",
      "remember", "house", "wrong", "write", "everyone", "late", "care", "heart",
      "another", "someone", "move", "easy", "were", "count",
      "whole", "problem", "break", "which", "must", "wear",
      "buy", "through", "together", "stuff", "three", "ready", "already",
      "life", "kind", "anything", "lose", "bear", "share", "going",
      "coin", "point", "wood", "busy", "shake", "head", "stories", "promise",
      "surprise", "silly", "early", "scoot", "whose", "check", "found", "everybody",
      "stand", "understand", "hour", "change", "most", "almost", "close",
      "finally", "ago", "important",
      "feet", "wheel", "quick", "slow", "quiet", "touch", "smile", "strong", "angry",
      "heal", "extra", "heavy", "winter", "spring", "scary", "fast",
      "space", "excited", "short", "practice", "along", "shout",
      "their"
    ];

    // "Practice most" words - show up about 3x as often as normal words
    const weight3Words = [
      "they", "then", "when", "were", "where",
      "guess", "remember", "wrong", "write", "whole", "right", "what", "lose", "says",
      "practice", "busy", "quite", "live", "even"
    ];
    
    // "Practice most" words - show up about 10x as often as normal words
    const weight10Words = [
      "Canada", "Greenland"
    ];
    
    // ------------------------------------------------------------------
    // Build one weighted pool from the three lists above. If a word shows
    // up in more than one list, the highest weight it's listed with wins.
    // ------------------------------------------------------------------
    const wordWeight = new Map();
    for (const w of weight1Words) {
      if (!wordWeight.has(w)) wordWeight.set(w, 1);
    }
    for (const w of weight2Words) {
      wordWeight.set(w, Math.max(wordWeight.get(w) || 0, 2));
    }
    for (const w of weight3Words) {
      wordWeight.set(w, Math.max(wordWeight.get(w) || 0, 3));
    }
    for (const w of weight10Words) {
      wordWeight.set(w, Math.max(wordWeight.get(w) || 0, 10));
    }
    // Turn the Map into a flat list of {word, weight} plus a running total,
    // so we can pick a random word in proportion to its weight.
    const weightedWords = Array.from(wordWeight.entries()).map(([word, weight]) => ({ word, weight }));
    const totalWeight = weightedWords.reduce((sum, w) => sum + w.weight, 0);

    let lastWord = null; // avoid showing the exact same word twice in a row

    // Picks a random word so that higher-weight words come up more often
    function pickWeightedWord() {
      let choice;
      do {
        let roll = Math.random() * totalWeight;
        for (const entry of weightedWords) {
          roll -= entry.weight;
          if (roll <= 0) {
            choice = entry.word;
            break;
          }
        }
      } while (choice === lastWord && weightedWords.length > 1);
      lastWord = choice;
      return choice;
    }

    // Function that picks a weighted random word and updates the page
    function nextWord() {
      const randomWord = pickWeightedWord();

      // Update the heading with the new random word
      document.getElementById("word").textContent = randomWord;

      // Update the message below the word
      document.getElementById("message").textContent = "Great! Here's another word!";
    }
  </script>

</body>
</html>
